[package]
name = "lyricsdock"
version = "0.2.0"
description = "Floating synchronized-lyrics overlay"
authors = ["LyricsDock contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "lyricsdock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
getrandom = "0.3"
log = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
